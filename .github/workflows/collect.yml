name: Coleta de códigos

# Pipeline 100% automático: lê as fontes a cada 30 min, publica códigos
# novos direto em codes.json e expira os que sumiram. Sem aprovação humana.
# O commit dispara o rebuild do Cloudflare Pages (repo conectado).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_APPROVAL_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run collect
      - name: Salva códigos publicados/expirados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: coleta automática de códigos'
          file_pattern: 'src/data/*.json'
      # Só rebuilda e publica quando a base mudou (último commit = bot).
      - id: mudou
        run: |
          if git log -1 --pretty=%cn | grep -q "github-actions"; then
            echo "mudou=true" >> $GITHUB_OUTPUT
          else
            echo "mudou=false" >> $GITHUB_OUTPUT
          fi
      - run: npm run build
        if: steps.mudou.outputs.mudou == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_TOP: ${{ vars.PUBLIC_ADSENSE_SLOT_TOP }}
          PUBLIC_ADSENSE_SLOT_ARTIGO: ${{ vars.PUBLIC_ADSENSE_SLOT_ARTIGO }}
      - run: npx wrangler pages deploy dist --project-name codigos-jogos --branch master
        if: steps.mudou.outputs.mudou == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
